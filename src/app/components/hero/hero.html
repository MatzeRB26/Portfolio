<section class="hero">
  <img class="shadow shadow-left" src="assets/images/hero/purple-shadow-left.png" alt="" />
  <img class="shadow shadow-right" src="assets/images/hero/blue-shadow-right.png" alt="" />
  <div class="hero-inner">
    <div class="hero-content">
      <div class="hero-headline">
          <span class="hero-intro" [class.german-text]="isGerman">{{ 'HERO.INTRO' | translate }}</span>        
        <div class="hero-text">
          <h1>MATTHÄUS STOJAK</h1>
          <h2>FRONTEND DEVELOPER</h2>
        </div>
      </div>
      <button class="primary-btn" [class.german-text]="isGerman" type="button" (click)="scrollToContact()">{{ 'HERO.LETSTALK' | translate }}</button>
    </div>
    <div class="social-wrapper">
      <div class="line"></div>
      <div class="social-icons">
        <a href="https://github.com/MatzeRB26" target="_blank"><img src="assets/images/hero/social/github.svg" alt="git"/></a>
        <a href="#contact"><img src="assets/images/hero/social/mail.svg" alt="mail"/></a>
        <a href="https://linkedin.com/in/DEIN_LINKEDIN" target="_blank"><img src="assets/images/hero/social/linkedin.svg" alt="linkedin"/></a>
      </div>
    </div>
    <div class="scroll-down">
      <span [class.german-text]="isGerman">{{ 'HERO.SCROLL' | translate }}</span>
      <img src="assets/images/hero/arrow-down.svg" alt="" />
    </div>
  </div>
</section>
